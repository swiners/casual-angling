name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (public files only)
        run: |
          mkdir _site
          cp index.html styles.css app.js spots.js drive-grid.js drive-slider.js _site/

      # The Maps key lives in the GOOGLE_MAPS_KEY repo secret, never in git.
      # It's a browser key, so it's visible in the served page by design; the referrer
      # and API restrictions on the key (in Google Cloud) are what protect it.
      - name: Write config.js from secret
        env:
          KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          # Only accept a well-formed Google key so nothing unexpected is written into JS.
          if printf '%s' "$KEY" | grep -Eq '^AIza[A-Za-z0-9_-]{35}$'; then SAFE="$KEY"; else SAFE=""; echo "No valid key set; site will use free map tiles."; fi
          printf "window.CASUAL_ANGLING_CONFIG = { googleMapsKey: '%s', mapId: 'DEMO_MAP_ID' };\n" "$SAFE" > _site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
