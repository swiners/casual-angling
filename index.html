<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- Keep search engines out; this is a personal book, not a public guide. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffffff">
<title>Casual Angling · Fishing spots around Melbourne</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-4 7-5 11-3 2 1 4 3 6 3-2 0-4 2-6 3-4 2-8 1-11-3z"/><path d="M3 12l-1 3M3 12L2 9"/></svg>
    </div>
    <div class="brand-text">
      <div class="brand-name">Casual Angling</div>
      <div class="brand-sub">Your record of good fishing spots</div>
    </div>
  </div>
  <label class="search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search spots" aria-label="Search spots" autocomplete="off">
    <kbd>⌘ K</kbd>
  </label>
  <button type="button" class="btn primary add-top" id="addBtn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>Add spot</span>
  </button>
</header>

<main class="stage">
  <div id="map"></div>

  <!-- Spots: left panel on desktop, bottom sheet on mobile -->
  <aside class="sheet" id="sheet" aria-label="Spots">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Expand or collapse the spot list"><span></span></div>

    <section class="drive" id="drive">
      <div class="drive-hd" aria-hidden="true">
        <p class="drive-q"><span class="drive-pre">Within</span> <span class="drive-val">Any distance</span></p>
        <p class="drive-count"><b class="drive-n">0</b> <span class="drive-unit">spots</span><span class="drive-delta"></span></p>
      </div>
      <div class="drive-slider">
        <input class="drive-input" type="range" aria-label="Maximum drive time from home">
        <div class="drive-strip" aria-hidden="true"></div>
        <div class="drive-veil" aria-hidden="true"></div>
        <div class="drive-track" aria-hidden="true"><div class="drive-fill"></div></div>
        <div class="drive-ticks" aria-hidden="true"></div>
        <div class="drive-thumb" aria-hidden="true"></div>
        <div class="drive-labels" aria-hidden="true"></div>
      </div>
    </section>

    <div class="tools" id="tools">
      <div class="chips" role="group" aria-label="Filters">
        <button type="button" class="chip" data-filter="want" aria-pressed="false">★ Want to go</button>
        <button type="button" class="chip" data-filter="fished" aria-pressed="false">✓ Fished</button>
        <button type="button" class="chip" id="ringsToggle" aria-pressed="false">Show range</button>
      </div>
      <div class="list-head">
        <div class="meta" id="listMeta"></div>
        <div class="seg" role="group" aria-label="List view">
          <button type="button" data-mode="groups">By water</button>
          <button type="button" data-mode="all">By drive</button>
        </div>
      </div>
    </div>

    <div class="list" id="list"></div>

    <footer class="sheet-foot">
      <div class="season"><span class="dot" id="seasonDot"></span><span id="seasonTxt"></span></div>
      <div class="foot-actions">
        <button type="button" class="link-btn" id="exportBtn">Export book</button>
        <label class="link-btn">Import<input type="file" id="importFile" accept="application/json" hidden></label>
      </div>
      <div class="fine">Drive times from <span id="homeName">home</span>, no traffic.</div>
    </footer>

    <button type="button" class="icon-btn collapse" id="collapse" aria-label="Collapse list" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </aside>

  <!-- Map type: segmented on desktop, one layers button on mobile -->
  <div class="maptype-wrap" id="maptypeWrap">
    <button type="button" class="round-btn layers-btn" id="layersBtn" aria-label="Map type" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <div class="maptype card" role="radiogroup" aria-label="Map type" id="maptype"></div>
  </div>

  <button type="button" class="fab" id="fab" aria-label="Add a spot here">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="engine-note" id="engineNote" hidden></div>
  <div class="add-banner card" id="addBanner" hidden>
    <span id="addMsg">Tap the map to drop a pin</span>
    <button type="button" class="btn small" id="useLoc">Use my location</button>
    <button type="button" class="link-btn" id="cancelAdd">Cancel</button>
  </div>

  <section class="detail" id="detail" hidden aria-live="polite"></section>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- config.js holds the Google Maps key; it is gitignored and written at deploy. Missing = free tiles. -->
<script src="config.js"></script>
<script src="spots.js"></script>
<script src="spots-research.js"></script>
<script src="drive-grid.js"></script>
<script src="drive-slider.js"></script>
<script src="app.js"></script>
</body>
</html>
